[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomnom-ingest"
version = "0.1.0"
description = "Local, verified SD-card photo ingestion"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nomnom = "nomnom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
