[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomnom-ingest"
version = "0.2.0"
description = "Local SD-card ingestion and file distribution"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
macos = ["rumps>=0.4.0", "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'"]
exif = ["Pillow>=9.2"]

[project.scripts]
nomnom = "nomnom.cli:main"
nomnom-menubar = "nomnom.platforms.macos_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nomnom = ["assets/*.png", "assets/*.icns", "assets/*.svg"]
